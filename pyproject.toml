[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "codex-session-audit"
version = "0.1.0"
description = "Privacy-preserving analytics for Codex JSONL session homes"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Klever Engineering" }]
keywords = ["codex", "openai", "prompt-engineering", "session-analytics"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.scripts]
codex-session-audit = "codex_session_audit.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/codex_session_audit"]

[tool.pytest.ini_options]
testpaths = ["tests"]
